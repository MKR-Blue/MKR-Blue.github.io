<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Place For You 🪻</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --purple:#9b72c7;
    --deep-purple:#6f4b91;
    --light-purple:#eadcf5;
    --soft-purple:#f6effa;
    --text:#493653;
    --white:rgba(255,255,255,0.88);
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    min-height:100vh;
    color:var(--text);

    background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.65), transparent 25%),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,.45), transparent 22%),
        linear-gradient(135deg,#e9d5f1,#cba9df,#dcbce9,#f0ddf5);

    background-attachment:fixed;
    overflow-x:hidden;
}

/* Floating petals */

.petal{
    position:fixed;
    font-size:22px;
    opacity:.35;
    pointer-events:none;
    animation:floatPetal linear infinite;
    z-index:0;
}

.p1{left:8%;top:10%;animation-duration:10s;}
.p2{left:25%;top:75%;animation-duration:13s;}
.p3{left:55%;top:20%;animation-duration:11s;}
.p4{left:80%;top:65%;animation-duration:15s;}
.p5{left:92%;top:15%;animation-duration:12s;}

@keyframes floatPetal{
    0%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-35px) rotate(100deg);}
    100%{transform:translateY(0) rotate(200deg);}
}

/* Layout */

.app{
    position:relative;
    z-index:1;
    display:flex;
    min-height:100vh;
}

/* Sidebar */

.sidebar{
    width:270px;
    min-height:100vh;
    padding:28px 18px;

    background:rgba(111,75,145,.82);
    backdrop-filter:blur(14px);

    color:white;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    overflow-y:auto;

    box-shadow:5px 0 25px rgba(60,30,80,.15);
}

.logo{
    text-align:center;
    margin-bottom:28px;
}

.logo .flower{
    font-size:40px;
}

.logo h2{
    font-size:20px;
    margin-top:5px;
}

.logo p{
    font-size:12px;
    opacity:.8;
    margin-top:5px;
}

.nav-title{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:.65;
    margin:20px 12px 9px;
}

.nav-btn{
    width:100%;
    border:none;
    background:transparent;
    color:white;
    padding:12px 14px;
    margin:3px 0;
    border-radius:14px;
    text-align:left;
    cursor:pointer;
    font-size:14px;
    transition:.25s;
}

.nav-btn:hover{
    background:rgba(255,255,255,.16);
    transform:translateX(3px);
}

.nav-btn.active{
    background:rgba(255,255,255,.24);
}

.nav-btn.locked{
    opacity:.42;
    cursor:not-allowed;
}

.nav-btn .emoji{
    margin-right:9px;
}

.mega-nav{
    margin-top:8px;
    border:1px solid rgba(255,255,255,.22);
}

/* Main */

.main{
    margin-left:270px;
    width:calc(100% - 270px);
    padding:35px;
}

.page{
    max-width:1050px;
    margin:auto;
}

/* Hero */

.hero{
    min-height:310px;
    border-radius:30px;

    background:rgba(255,255,255,.62);
    backdrop-filter:blur(15px);

    padding:45px;
    text-align:center;

    box-shadow:0 15px 45px rgba(74,45,95,.13);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.hero .small{
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#76558f;
}

.hero h1{
    font-family:Georgia,serif;
    font-size:clamp(32px,5vw,58px);
    margin:14px 0 10px;
    color:#604477;
}

.hero p{
    max-width:650px;
    line-height:1.7;
    font-size:16px;
}

/* Countdown */

.countdown{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:25px;
    flex-wrap:wrap;
}

.time-box{
    min-width:75px;
    padding:14px 12px;
    border-radius:17px;
    background:rgba(255,255,255,.82);
    box-shadow:0 5px 18px rgba(70,40,90,.08);
}

.time-box strong{
    display:block;
    font-size:27px;
    color:#684985;
}

.time-box span{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    opacity:.65;
}

/* Today's gift */

.today-card{
    margin-top:25px;
    background:rgba(255,255,255,.75);
    border-radius:25px;
    padding:28px;
    text-align:center;
    box-shadow:0 10px 30px rgba(74,45,95,.10);
}

.today-card h2{
    font-family:Georgia,serif;
    color:#684985;
    margin-bottom:8px;
}

.gift-btn{
    border:none;
    margin-top:18px;
    padding:15px 28px;
    border-radius:50px;

    background:linear-gradient(135deg,#8b63ad,#a77ac5);
    color:white;

    font-size:15px;
    font-weight:600;
    cursor:pointer;

    box-shadow:0 8px 20px rgba(95,60,120,.22);
    transition:.25s;
}

.gift-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(95,60,120,.3);
}

/* Content card */

.content-card{
    margin-top:25px;
    padding:35px;

    background:rgba(255,255,255,.78);
    border-radius:28px;

    box-shadow:0 12px 35px rgba(74,45,95,.12);
}

.content-card h1{
    font-family:Georgia,serif;
    text-align:center;
    color:#624477;
    margin-bottom:8px;
}

.date-label{
    text-align:center;
    font-size:13px;
    opacity:.6;
    margin-bottom:25px;
}

.poem{
    max-width:700px;
    margin:0 auto;
    text-align:center;
    font-family:Georgia,serif;
    font-size:19px;
    line-height:2;
    white-space:pre-line;
    color:#5a4167;
}

.letter{
    max-width:760px;
    margin:auto;
    font-size:17px;
    line-height:1.9;
    white-space:pre-line;
}

/* Images */

.image-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    margin-top:30px;
}

.image-grid.three{
    grid-template-columns:repeat(3,1fr);
}

.image-grid img{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:22px;

    box-shadow:0 8px 22px rgba(60,30,80,.13);

    transition:.3s;
}

.image-grid img:hover{
    transform:scale(1.025) rotate(.4deg);
}

/* Final */

.final-card{
    text-align:center;
}

.final-card .big-flower{
    font-size:65px;
    margin-bottom:15px;
}

.final-card h1{
    font-size:42px;
}

.final-message{
    font-family:Georgia,serif;
    font-size:19px;
    line-height:1.9;
    max-width:720px;
    margin:20px auto;
}

/* Back button */

.back-btn{
    display:block;
    margin:25px auto 0;
    border:none;
    background:rgba(111,75,145,.1);
    color:#654579;
    padding:11px 20px;
    border-radius:30px;
    cursor:pointer;
}

.back-btn:hover{
    background:rgba(111,75,145,.18);
}

/* Mobile */

.mobile-top{
    display:none;
}

@media(max-width:800px){

    .sidebar{
        width:230px;
        transform:translateX(-100%);
        transition:.3s;
        z-index:20;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        width:100%;
        padding:18px;
    }

    .mobile-top{
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-bottom:15px;
    }

    .menu-btn{
        border:none;
        background:rgba(255,255,255,.7);
        border-radius:12px;
        padding:10px 14px;
        font-size:20px;
        cursor:pointer;
    }

    .hero{
        padding:30px 20px;
    }

    .content-card{
        padding:24px 17px;
    }

    .image-grid,
    .image-grid.three{
        grid-template-columns:1fr;
    }

    .poem{
        font-size:17px;
    }

    .letter{
        font-size:16px;
    }
}

</style>
</head>

<body>

<!-- Floating flowers -->

<div class="petal p1">🪻</div>
<div class="petal p2">🌸</div>
<div class="petal p3">🪻</div>
<div class="petal p4">🌷</div>
<div class="petal p5">🌸</div>


<div class="app">

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar" id="sidebar">

    <div class="logo">
        <div class="flower">🪻</div>
        <h2>A Little Place For You</h2>
        <p>made with a little love ♡</p>
    </div>

    <div class="nav-title">Pages</div>

    <button class="nav-btn active" onclick="showHome()">
        <span class="emoji">🏠</span> Home
    </button>

    <div class="nav-title">Your Little Poems</div>

    <div id="dayNavigation"></div>

    <div class="nav-title">The Big Day</div>

    <button
        id="megaNav"
        class="nav-btn mega-nav locked"
        onclick="openMega()">
        <span class="emoji">🎂</span> Mega Surprise 🔒
    </button>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <div class="mobile-top">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <span>🪻 A Little Place For You</span>
        <span></span>
    </div>

    <div class="page" id="page"></div>

</main>

</div>


<script>

/* ==========================================================
   WEBSITE SETTINGS
   ========================================================== */

/*
   Birthday:
   14 September 2026

   Daily pages:
   Day 1 = September 6
   Day 2 = September 7
   Day 3 = September 8
   Day 4 = September 9
   Day 5 = September 10
   Day 6 = September 11
   Day 7 = September 12
   Day 8 = September 13

   September 14 = MEGA SURPRISE
*/

const BIRTHDAY = new Date(2026, 8, 14, 0, 0, 0);


/* ==========================================================
   ✏️ EDIT YOUR POEMS AND LETTERS HERE
   ========================================================== */

const days = [

{
    number:1,
    date:"September 6",
    poem:`There are little moments,
little smiles,
little memories,
that somehow become
the brightest parts of a day.

And somehow,
you have become
one of those beautiful parts
of mine. 🪻`,
    letter:`Hey you ♡

This is the first little page of something I wanted to make for you.

I know it is just a website, but I wanted every little part of it to feel like a tiny reminder that someone was thinking about you.

So whenever you open this page, I hope it gives you a small reason to smile.

This is only Day 1.

There are still a few little surprises waiting for you.

With lots of warmth,
me ♡`
},

{
    number:2,
    date:"September 7",
    poem:`Some people arrive
like a quiet song,

and somehow
the world feels
a little softer
after they do. 🌷`,
    letter:`Day 2 ♡

Today I just wanted to remind you of something simple.

You deserve good days,
unexpected smiles,
and moments that make you stop and think,

"Today was a really nice day."

I hope today gives you at least one of those moments.

And if it doesn't,
maybe this little page can be one. 🪻`
},

{
    number:3,
    date:"September 8",
    poem:`If memories were flowers,
I'd keep every one,

and make a garden
out of all the moments
I never want to forget. 🌸`,
    letter:`Day 3 ♡

Three days already.

I hope you are enjoying these tiny surprises.

There are some things that are difficult to say in one big message, so I thought I would spread them across a few little days instead.

One thought.
One poem.
One memory.
One smile at a time.

More is coming. ♡`
},

{
    number:4,
    date:"September 9",
    poem:`A little laughter,
a little chaos,
a little sunshine,

and somehow
an ordinary day
becomes a favourite memory. 🪻`,
    letter:`Day 4 ♡

Halfway through the little countdown.

I hope these pages don't feel like just another website.

I wanted them to feel more like a tiny corner of the internet that exists just for a few special memories.

So take your time with each page.

There is no rush. 🌷`
},

{
    number:5,
    date:"September 10",
    poem:`You don't need
a perfect day

to make a day
worth remembering.

Sometimes,
one beautiful moment
is enough. 🌸`,
    letter:`Day 5 ♡

Today is another little reminder that the smallest things can mean a lot.

A message.
A laugh.
A random memory.
A silly conversation.

Those little things often become the memories we keep coming back to.

So here's to all the little things. 🪻`
},

{
    number:6,
    date:"September 11",
    poem:`If happiness had
a little garden,

I think it would be
filled with flowers,
warm sunlight,
and your favourite colours. 💜`,
    letter:`Day 6 ♡

Only a couple more pages before the big day.

I hope by now you've realised that I put quite a bit of thought into this.

There is still something waiting at the end.

Until then,
enjoy today's little piece of it. ♡`
},

{
    number:7,
    date:"September 12",
    poem:`Some moments
are photographs.

Some moments
are memories.

And some moments
quietly become
part of who we are. 🌷`,
    letter:`Day 7 ♡

Almost there.

Tomorrow is the last little page before the birthday surprise.

I hope these little poems and letters have made the countdown a little more fun.

One more day.

Then the final surprise. 🪻`
},

{
    number:8,
    date:"September 13",
    poem:`Tomorrow isn't
just another day.

It is a day worth celebrating,
a day worth smiling for,
and a day that deserves
a little extra magic. 🌸`,
    letter:`Day 8 ♡

This is the last little page before your birthday.

Tomorrow everything changes.

No more countdown.
No more locked page.
No more waiting.

Just one final surprise that I hope makes you smile.

See you tomorrow. 💜`
}

];


/* ==========================================================
   🎂 FINAL BIRTHDAY LETTER
   ========================================================== */

const finalLetter = `Happy Birthday! ♡

Today is your day.

I wanted to make something a little different this year — something you could open one day at a time, with a tiny poem, a few pictures, and a few words waiting for you.

Maybe it is not the biggest surprise in the world.

But every little part of it was made with one simple thought:

I wanted to make you smile.

So here it is.

Your little birthday corner of the internet. 🪻

I hope this new year of your life brings you beautiful memories, peaceful days, lots of laughter, and countless reasons to smile.

Keep being wonderfully you.

Happy Birthday. 💜

— from me ♡`;


/* ==========================================================
   DATE FUNCTIONS
   ========================================================== */

function todayOnly(){
    const now = new Date();

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );
}

function birthdayDate(){
    return new Date(
        BIRTHDAY.getFullYear(),
        BIRTHDAY.getMonth(),
        BIRTHDAY.getDate()
    );
}

function isBirthday(){
    const today = todayOnly();
    const birthday = birthdayDate();

    return today.getTime() === birthday.getTime();
}

function daysUnlocked(){

    const start = new Date(2026,8,6);
    const today = todayOnly();

    const difference =
        Math.floor(
            (today - start) /
            (1000*60*60*24)
        );

    return difference + 1;
}


/* ==========================================================
   SIDEBAR
   ========================================================== */

function createNavigation(){

    const nav = document.getElementById("dayNavigation");

    nav.innerHTML = "";

    const unlocked = daysUnlocked();

    days.forEach(day => {

        const button = document.createElement("button");

        const available =
            day.number <= unlocked &&
            !isBirthday();

        button.className =
            "nav-btn" +
            (available ? "" : " locked");

        button.innerHTML =
            `<span class="emoji">🌷</span>
             Day ${day.number} · ${day.date}
             ${available ? "" : " 🔒"}`;

        if(available){
            button.onclick = () => openDay(day.number);
        }

        nav.appendChild(button);
    });


    const mega = document.getElementById("megaNav");

    if(isBirthday()){

        mega.classList.remove("locked");

        mega.innerHTML =
            `<span class="emoji">🎂</span>
             Mega Surprise ✨`;

    }else{

        mega.classList.add("locked");

        mega.innerHTML =
            `<span class="emoji">🎂</span>
             Mega Surprise 🔒`;

    }
}


/* ==========================================================
   HOME
   ========================================================== */

function showHome(){

    closeSidebar();

    const today = todayOnly();

    let todayNumber = daysUnlocked();

    if(todayNumber < 1){
        todayNumber = 1;
    }

    if(todayNumber > 8){
        todayNumber = 8;
    }

    let homeMessage =
        "A little place filled with tiny surprises, poems and memories.";

    if(isBirthday()){
        homeMessage =
            "Today is finally here. Your big surprise is waiting. 🎂";
    }

    document.getElementById("page").innerHTML = `

        <section class="hero">

            <div class="small">
                a tiny corner made just for you
            </div>

            <h1>Hey, you. 🪻</h1>

            <p>
                ${homeMessage}
            </p>

            <div class="countdown">

                <div class="time-box">
                    <strong id="days">00</strong>
                    <span>Days</span>
                </div>

                <div class="time-box">
                    <strong id="hours">00</strong>
                    <span>Hours</span>
                </div>

                <div class="time-box">
                    <strong id="minutes">00</strong>
                    <span>Minutes</span>
                </div>

                <div class="time-box">
                    <strong id="seconds">00</strong>
                    <span>Seconds</span>
                </div>

            </div>

        </section>


        ${
            isBirthday()
            ?
            `
            <section class="today-card">

                <h2>🎂 It's finally here</h2>

                <p>
                    Your birthday surprise is ready.
                </p>

                <button
                    class="gift-btn"
                    onclick="openMega()">

                    ✨ OPEN MEGA SURPRISE ✨

                </button>

            </section>
            `
            :
            `
            <section class="today-card">

                <h2>💌 Your little gift for today</h2>

                <p>
                    A letter is waiting for you.
                </p>

                <button
                    class="gift-btn"
                    onclick="openTodayGift()">

                    💌 OPEN TODAY'S GIFT

                </button>

            </section>
            `
        }

    `;

    startCountdown();
}


/* ==========================================================
   TODAY'S LETTER
   ========================================================== */

function openTodayGift(){

    if(isBirthday()){
        openMega();
        return;
    }

    let number = daysUnlocked();

    if(number < 1){
        number = 1;
    }

    if(number > 8){
        number = 8;
    }

    const day = days[number-1];

    closeSidebar();

    document.getElementById("page").innerHTML = `

        <section class="content-card">

            <h1>💌 Today's Little Gift</h1>

            <div class="date-label">
                ${day.date}
            </div>

            <div class="letter">
                ${day.letter}
            </div>

            <button
                class="back-btn"
                onclick="showHome()">

                ← Back Home

            </button>

        </section>

    `;
}


/* ==========================================================
   DAILY POEM PAGE
   ========================================================== */

function openDay(number){

    const unlocked = daysUnlocked();

    if(number > unlocked || isBirthday()){
        return;
    }

    const day = days[number-1];

    closeSidebar();

    document.getElementById("page").innerHTML = `

        <section class="content-card">

            <h1>🌷 Day ${day.number}</h1>

            <div class="date-label">
                ${day.date}
            </div>

            <div class="poem">
                ${day.poem}
            </div>

            <div class="image-grid">

                <img
                    src="images/day${day.number}-photo1.jpg"
                    alt="A special memory">

                <img
                    src="images/day${day.number}-photo2.jpg"
                    alt="A special memory">

            </div>

            <button
                class="back-btn"
                onclick="showHome()">

                ← Back Home

            </button>

        </section>

    `;
}


/* ==========================================================
   🎂 MEGA SURPRISE
   ========================================================== */

function openMega(){

    if(!isBirthday()){
        alert(
            "Not yet 🪻\n\n" +
            "The Mega Surprise opens on September 14."
        );

        return;
    }

    closeSidebar();

    document.getElementById("page").innerHTML = `

        <section class="content-card final-card">

            <div class="big-flower">
                🪻🌷🌸
            </div>

            <h1>🎂 Your Mega Surprise</h1>

            <p class="final-message">
                Today is the day.
                <br><br>
                Everything was waiting for this moment.
                <br><br>
                So take a breath...
                <br>
                and open your final little surprise. 💜
            </p>

            <div class="letter">
                ${finalLetter}
            </div>

            <div class="image-grid three">

                <img
                    src="images/final-photo1.jpg"
                    alt="Birthday memory">

                <img
                    src="images/final-photo2.jpg"
                    alt="Birthday memory">

                <img
                    src="images/final-photo3.jpg"
                    alt="Birthday memory">

            </div>

            <button
                class="back-btn"
                onclick="showHome()">

                ← Back Home

            </button>

        </section>

    `;
}


/* ==========================================================
   COUNTDOWN
   ========================================================== */

function startCountdown(){

    const timer = setInterval(() => {

        const now = new Date();
        const difference = BIRTHDAY - now;

        if(
            !document.getElementById("days")
        ){
            clearInterval(timer);
            return;
        }

        if(difference <= 0){

            document.getElementById("days").textContent = "00";
            document.getElementById("hours").textContent = "00";
            document.getElementById("minutes").textContent = "00";
            document.getElementById("seconds").textContent = "00";

            return;
        }

        const daysLeft =
            Math.floor(
                difference /
                (1000*60*60*24)
            );

        const hoursLeft =
            Math.floor(
                (difference /
                (1000*60*60)) % 24
            );

        const minutesLeft =
            Math.floor(
                (difference /
                (1000*60)) % 60
            );

        const secondsLeft =
            Math.floor(
                (difference / 1000) % 60
            );

        document.getElementById("days").textContent =
            String(daysLeft).padStart(2,"0");

        document.getElementById("hours").textContent =
            String(hoursLeft).padStart(2,"0");

        document.getElementById("minutes").textContent =
            String(minutesLeft).padStart(2,"0");

        document.getElementById("seconds").textContent =
            String(secondsLeft).padStart(2,"0");

    },1000);
}


/* ==========================================================
   MOBILE MENU
   ========================================================== */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}

function closeSidebar(){

    document
        .getElementById("sidebar")
        .classList.remove("open");

}


/* ==========================================================
   START WEBSITE
   ========================================================== */

createNavigation();
showHome();

</script>

</body>
</html>
