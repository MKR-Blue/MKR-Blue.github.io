<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --purple:#9b72c7;
    --deep-purple:#6f4b91;
    --light-purple:#eadcf5;
    --soft-purple:#f6effa;
    --text:#493653;
    --white:rgba(255,255,255,0.88);
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    min-height:100vh;
    color:var(--text);

    background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.65), transparent 25%),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,.45), transparent 22%),
        linear-gradient(135deg,#e9d5f1,#cba9df,#dcbce9,#f0ddf5);

    background-attachment:fixed;
    overflow-x:hidden;
}

/* Floating petals */

.petal{
    position:fixed;
    font-size:22px;
    opacity:.35;
    pointer-events:none;
    animation:floatPetal linear infinite;
    z-index:0;
}

.p1{left:8%;top:10%;animation-duration:10s;}
.p2{left:25%;top:75%;animation-duration:13s;}
.p3{left:55%;top:20%;animation-duration:11s;}
.p4{left:80%;top:65%;animation-duration:15s;}
.p5{left:92%;top:15%;animation-duration:12s;}

@keyframes floatPetal{
    0%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-35px) rotate(100deg);}
    100%{transform:translateY(0) rotate(200deg);}
}

/* Layout */

.app{
    position:relative;
    z-index:1;
    display:flex;
    min-height:100vh;
}

/* Sidebar */

.sidebar{
    width:270px;
    min-height:100vh;
    padding:28px 18px;

    background:rgba(111,75,145,.82);
    backdrop-filter:blur(14px);

    color:white;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    overflow-y:auto;

    box-shadow:5px 0 25px rgba(60,30,80,.15);
}

.logo{
    text-align:center;
    margin-bottom:28px;
}

.logo .flower{
    font-size:40px;
}

.logo h2{
    font-size:20px;
    margin-top:5px;
}

.logo p{
    font-size:12px;
    opacity:.8;
    margin-top:5px;
}

.nav-title{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:.65;
    margin:20px 12px 9px;
}

.nav-btn{
    width:100%;
    border:none;
    background:transparent;
    color:white;
    padding:12px 14px;
    margin:3px 0;
    border-radius:14px;
    text-align:left;
    cursor:pointer;
    font-size:14px;
    transition:.25s;
}

.nav-btn:hover{
    background:rgba(255,255,255,.16);
    transform:translateX(3px);
}

.nav-btn.active{
    background:rgba(255,255,255,.24);
}

.nav-btn.locked{
    opacity:.42;
    cursor:not-allowed;
}

.nav-btn .emoji{
    margin-right:9px;
}

.mega-nav{
    margin-top:8px;
    border:1px solid rgba(255,255,255,.22);
}

/* Main */

.main{
    margin-left:270px;
    width:calc(100% - 270px);
    padding:35px;
}

.page{
    max-width:1050px;
    margin:auto;
}

/* Hero */

.hero{
    min-height:310px;
    border-radius:30px;

    background:rgba(255,255,255,.62);
    backdrop-filter:blur(15px);

    padding:45px;
    text-align:center;

    box-shadow:0 15px 45px rgba(74,45,95,.13);

    flex-direction:column;
    justify-content:center;
    align-items:center;

.hero .small{

    letter-spacing:2px;
    text-transform:uppercase;
    color:#76558f;
}

.hero h1{
    font-family:Georgia,serif;
    font-size:clamp(32px,5vw,58px);
    margin:14px 0 10px;
    color:#604477;
}

.hero p{

    line-height:1.7;
    font-size:16px;
}

    margin-top:25px;
    flex-wrap:wrap;

.time-box{
    min-width:75px;
    padding:14px 12px;

    background:rgba(255,255,255,.82);
    box-shadow:0 5px 18px rgba(70,40,90,.08);

    font-size:27px;
    color:#684985;
}

.time-box span{

.poem{

    margin:0 auto;
    text-align:center;
    font-family:Georgia,serif;
    font-size:19px;
    line-height:2;
    white-space:pre-line;

.letter{

    margin:auto;
    font-size:17px;
    line-height:1.9;
    white-space:pre-line;

.image-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    margin-top:30px;
}

.image-grid.three{
    grid-template-columns:repeat(3,1fr);
}

.image-grid img{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:22px;

    box-shadow:0 8px 22px rgba(60,30,80,.13);

    transition:.3s;
}

.image-grid img:hover{
    transform:scale(1.025) rotate(.4deg);

/* Final */

.final-card{

.final-card .big-flower{

.final-card h1{

.final-message{

    font-size:19px;
    line-height:1.9;
    max-width:720px;
    margin:20px auto;

/* Back button */

.back-btn{
    display:block;
    margin:25px auto 0;
    border:none;
    background:rgba(111,75,145,.1);
    color:#654579;
    padding:11px 20px;

.back-btn:hover{

/* Mobile */

.mobile-top{

@media(max-width:800px){

    }

    .poem{
        font-size:17px;
    }

    .letter{
        font-size:16px;
    }
}

</style>
</head>

/* ==========================================================
   DATE FUNCTIONS
   ========================================================== */

function todayOnly(){
    const now = new Date();

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );
}

function birthdayDate(){
    return new Date(
        BIRTHDAY.getFullYear(),
        BIRTHDAY.getMonth(),
        BIRTHDAY.getDate()
    );
}

function isBirthday(){
    const today = todayOnly();
    const birthday = birthdayDate();

    return today.getTime() === birthday.getTime();
}

function daysUnlocked(){

    const start = new Date(2026,8,6);
    const today = todayOnly();

    const difference =
        Math.floor(
            (today - start) /
            (1000*60*60*24)
        );

    return difference + 1;
}


/* ==========================================================

function createNavigation(){

    const nav = document.getElementById("dayNavigation");

    nav.innerHTML = "";

    const unlocked = daysUnlocked();

    days.forEach(day => {

        const button = document.createElement("button");

        const available =
            day.number <= unlocked &&
            !isBirthday();

        button.className =
            "nav-btn" +
            (available ? "" : " locked");

        button.innerHTML =
            `<span class="emoji">🌷</span>
             Day ${day.number} · ${day.date}
             ${available ? "" : " 🔒"}`;

        if(available){
            button.onclick = () => openDay(day.number);
        }

        nav.appendChild(button);
    });


    const mega = document.getElementById("megaNav");

    if(isBirthday()){

        mega.classList.remove("locked");

        mega.innerHTML =
            `<span class="emoji">🎂</span>
             Mega Surprise ✨`;

    }else{

        mega.classList.add("locked");

        mega.innerHTML =
            `<span class="emoji">🎂</span>
             Mega Surprise 🔒`;

    }
}

/* ==========================================================
   COUNTDOWN
   ========================================================== */

function startCountdown(){

    const timer = setInterval(() => {

        const now = new Date();
        const difference = BIRTHDAY - now;

        if(
            !document.getElementById("days")
        ){
            clearInterval(timer);
            return;
        }

        if(difference <= 0){

            document.getElementById("days").textContent = "00";
            document.getElementById("hours").textContent = "00";
            document.getElementById("minutes").textContent = "00";
            document.getElementById("seconds").textContent = "00";

            return;
        }

        const daysLeft =
            Math.floor(
                difference /
                (1000*60*60*24)
            );

        const hoursLeft =
            Math.floor(
                (difference /
                (1000*60*60)) % 24
            );

        const minutesLeft =
            Math.floor(
                (difference /
                (1000*60)) % 60
            );

        const secondsLeft =
            Math.floor(
                (difference / 1000) % 60
            );

        document.getElementById("days").textContent =
            String(daysLeft).padStart(2,"0");

        document.getElementById("hours").textContent =
            String(hoursLeft).padStart(2,"0");

        document.getElementById("minutes").textContent =
            String(minutesLeft).padStart(2,"0");

        document.getElementById("seconds").textContent =
            String(secondsLeft).padStart(2,"0");

    },1000);
}
